<style>
/* Layout: banda grafito con logo y mes · cuadrícula Lun–Dom del mes · panel de detalle al elegir un evento · en celular, agenda en lista */
:root {
  --rojo: #ab0505; --gris: #dfdfdf; --grafito: #323131; --marino: #002455; --naranja: #f8450d;
  --bg: #ffffff; --surface: #f4f4f4; --line: #dfdfdf; --text: #323131; --muted: #4a4848;
  --band: #323131; --on-band: #dfdfdf; --chip: #ffffff;
  --alta: #ab0505; --media: #f8450d; --baja: #8a8a8a;
  --ok-bg: #e3ecf7; --ok-fg: #002455; --pend-bg: #f1f1f1; --pend-fg: #4a4848;
  --display: "League Gothic", "Oswald", "Arial Narrow", sans-serif;
  --body: "Bahnschrift", "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #242323; --surface: #2c2b2b; --line: #3f3d3d; --text: #dfdfdf; --muted: #bdbdbd;
  --band: #1b1a1a; --on-band: #dfdfdf; --chip: #323131; --baja: #9a9a9a;
  --ok-bg: #1d2f4a; --ok-fg: #c9dbf5; --pend-bg: #3a3838; --pend-fg: #d0d0d0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #242323; --surface: #2c2b2b; --line: #3f3d3d; --text: #dfdfdf; --muted: #bdbdbd;
  --band: #1b1a1a; --on-band: #dfdfdf; --chip: #323131; --baja: #9a9a9a;
  --ok-bg: #1d2f4a; --ok-fg: #c9dbf5; --pend-bg: #3a3838; --pend-fg: #d0d0d0; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--body) }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { background: var(--band); color: var(--on-band) }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding-block: 22px }
.logo { color: var(--gris); display: block; height: 44px }
.logo svg { height: 44px; width: auto; display: block }
.titulo { flex: 1 1 260px; min-width: 0 }
.titulo small { display: block; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8 }
.titulo h1 { margin: 0; font: 400 2.1rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance }
.barras { height: 6px; display: grid; grid-template-columns: 46fr 4fr 22fr 4fr 24fr }
.barras i:nth-child(1) { background: var(--rojo) } .barras i:nth-child(3) { background: var(--grafito) } .barras i:nth-child(5) { background: var(--gris) }

.mesbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 22px 14px }
.mes { display: flex; align-items: center; gap: 10px }
.mes h2 { margin: 0; min-width: 9ch; text-align: center; font: 400 2.6rem/1 var(--display); letter-spacing: .05em; text-transform: uppercase }
.mes button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 2px; cursor: pointer; font-size: 1.1rem }
.mes button:hover { border-color: var(--rojo); color: var(--rojo) }
button:focus-visible, .ev:focus-visible { outline: 3px solid var(--marino); outline-offset: 2px }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .85rem; color: var(--muted) }
.leyenda span { display: inline-flex; align-items: center; gap: 6px }
.leyenda b { width: 14px; height: 4px; border-radius: 2px; display: inline-block }
.resumen { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem; color: var(--muted); padding-bottom: 14px }
.resumen strong { color: var(--text); font-variant-numeric: tabular-nums }

.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line) }
.dow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface) }
.dia { min-height: 118px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.dia.fuera { background: var(--surface) }
.dia.fuera .num { opacity: .35 }
.num { font: 400 1.3rem/1 var(--display); letter-spacing: .03em }
.dia.hoy .num { background: var(--rojo); color: #fff; padding: 3px 7px 1px; align-self: flex-start; border-radius: 2px }
.ev { all: unset; cursor: pointer; display: block; background: var(--chip); border: 1px solid var(--line); border-left: 4px solid var(--baja); padding: 3px 6px; font-size: .78rem; line-height: 1.25; border-radius: 2px; min-width: 0 }
.ev:hover { border-color: var(--muted) }
.ev .n { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev .a { display: block; color: var(--muted); font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev.Alta { border-left-color: var(--alta) } .ev.Media { border-left-color: var(--media) } .ev.Baja { border-left-color: var(--baja) }
.ev.conf { background: var(--ok-bg) }
.ev.conf .n::before { content: "✓ "; color: var(--ok-fg) }

.lista { display: none; flex-direction: column; gap: 10px }
.vacio { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); grid-column: 1 / -1 }

.detalle { position: fixed; inset: 0; background: rgba(20,20,20,.55); display: flex; justify-content: flex-end; z-index: 20 }
.detalle[hidden] { display: none !important }
.panel { background: var(--bg); width: min(480px, 100%); height: 100%; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 32px 24px; display: flex; flex-direction: column; gap: 16px; border-left: 6px solid var(--rojo) }
.panel .cerrar { align-self: flex-end; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 6px 12px; cursor: pointer; border-radius: 2px; font: inherit }
.panel .af { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.panel h3 { margin: 0; font: 400 2rem/1.05 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: .78rem; padding: 3px 8px; border-radius: 2px; background: var(--pend-bg); color: var(--pend-fg) }
.chip.conf { background: var(--ok-bg); color: var(--ok-fg) }
.chip.p-Alta { background: var(--rojo); color: #fff }
dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 12px; font-size: .95rem }
dt { color: var(--muted); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; padding-top: 3px }
dd { margin: 0; white-space: pre-line; min-width: 0; overflow-wrap: anywhere }
.liga { margin: 0 0 14px } .liga a { color: var(--rojo); font-weight: 600 }
.tema { white-space: pre-line; font-size: .95rem; border-top: 1px solid var(--line); padding-top: 14px }
footer { color: var(--muted); font-size: .85rem; padding-block: 26px 40px }

@media (max-width: 760px) {
  .grid { display: none }
  .lista { display: flex }
  .mes h2 { font-size: 2.1rem }
  .item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; border-bottom: 1px solid var(--line); padding-bottom: 10px }
  .item .fecha { font: 400 1.9rem/1 var(--display); text-align: center; border: 1px solid var(--line); padding: 6px 0 4px }
  .item .fecha small { display: block; font: 600 .62rem/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
  .item .ev { white-space: normal } .item .ev .n, .item .ev .a { white-space: normal }
}
@media (prefers-reduced-motion: no-preference) { .ev { transition: border-color .15s } }
</style>

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const hoy = new Date();
let anio = 2026, mes = 9;
if (hoy.getFullYear() === 2026 && hoy.getMonth() >= 8 && hoy.getMonth() <= 11) mes = hoy.getMonth();
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const enDia = (e, s) => e.inicio <= s && s <= e.fin;
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chip(e, i) {
  const conf = e.estado === "Confirmado";
  const quien = e.afiliacion;
  return `<button class="ev ${esc(e.prioridad || "Baja")} ${conf ? "conf" : ""}" data-i="${i}" type="button">
    <span class="n">${esc(e.nombre)}</span><span class="a">${esc(e.hora ? e.hora + " · " : "")}${esc(quien)}</span></button>`;
}

function pintar() {
  document.getElementById("titulo-mes").textContent = MESES[mes];
  const primero = new Date(anio, mes, 1);
  const ini = new Date(primero); ini.setDate(1 - ((primero.getDay() + 6) % 7));
  let g = DIAS.map(d => `<div class="dow">${d}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(ini); d.setDate(ini.getDate() + k);
    if (k >= 35 && d.getMonth() !== mes) break;
    const s = iso(d);
    const evs = EVENTOS.map((e, i) => [e, i]).filter(([e]) => enDia(e, s));
    g += `<div class="dia ${d.getMonth() !== mes ? "fuera" : ""} ${s === iso(hoy) ? "hoy" : ""}">
      <span class="num">${d.getDate()}</span>${evs.map(([e, i]) => chip(e, i)).join("")}</div>`;
  }
  const delMes = EVENTOS.map((e, i) => [e, i]).filter(([e]) => {
    const a = `${anio}-${String(mes+1).padStart(2,"0")}`;
    return e.inicio.slice(0,7) <= a && a <= e.fin.slice(0,7);
  });
  if (!delMes.length) g += `<div class="vacio">Aún no hay eventos capturados para ${MESES[mes].toLowerCase()}. Se agregan en Zoho CRM › Campañas.</div>`;
  document.getElementById("grid").innerHTML = g;

  document.getElementById("lista").innerHTML = delMes.length ? delMes.map(([e, i]) => {
    const d = new Date(e.inicio + "T12:00");
    return `<div class="item"><div class="fecha">${d.getDate()}<small>${DIAS[(d.getDay()+6)%7]}</small></div>${chip(e, i)}</div>`;
  }).join("") : `<div class="vacio">Aún no hay eventos capturados para ${MESES[mes].toLowerCase()}.</div>`;

  const conf = delMes.filter(([e]) => e.estado === "Confirmado").length;
  const alta = delMes.filter(([e]) => e.prioridad === "Alta").length;
  document.getElementById("resumen").innerHTML =
    `<span><strong>${delMes.length}</strong> eventos</span><span><strong>${conf}</strong> confirmados</span><span><strong>${delMes.length - conf}</strong> por decidir</span><span><strong>${alta}</strong> de prioridad alta</span>`;
}

function fechaLarga(e) {
  const f = s => { const d = new Date(s + "T12:00"); return `${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`; };
  return (e.inicio === e.fin ? f(e.inicio) : `${f(e.inicio)} al ${f(e.fin)}`) + (e.hora ? `\n${e.hora} h` : "\nHorario por confirmar");
}

function abrir(i) {
  const e = EVENTOS[i];
  document.getElementById("d-af").textContent = e.afiliacion;
  document.getElementById("d-nombre").textContent = e.nombre;
  document.getElementById("d-chips").innerHTML =
    `<span class="chip ${e.estado === "Confirmado" ? "conf" : ""}">${esc(e.estado)}</span>` +
    (e.prioridad ? `<span class="chip p-${esc(e.prioridad)}">Prioridad ${esc(e.prioridad.toLowerCase())}</span>` : "") +
    (e.modalidad ? `<span class="chip">${esc(e.modalidad)}</span>` : "");
  const filas = [["Fecha", fechaLarga(e)], ["Lugar", e.lugar]];
  document.getElementById("d-datos").innerHTML = filas.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v || "Por definir")}</dd>`).join("");
  const lg = document.getElementById("d-liga"); lg.hidden = !e.liga;
  if (e.liga) document.getElementById("d-liga-a").href = e.liga;
  document.getElementById("d-tema").textContent = e.tema;
  document.getElementById("detalle").hidden = false;
  document.getElementById("cerrar").focus();
}
const cerrar = () => document.getElementById("detalle").hidden = true;

document.addEventListener("click", ev => {
  const b = ev.target.closest(".ev"); if (b) abrir(+b.dataset.i);
  if (ev.target.id === "detalle" || ev.target.id === "cerrar") cerrar();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") cerrar(); });
document.getElementById("prev").onclick = () => { if (mes > 0) { mes--; pintar(); } };
document.getElementById("next").onclick = () => { if (mes < 11) { mes++; pintar(); } };
pintar();
</script>
